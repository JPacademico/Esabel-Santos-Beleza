<!doctype html>
<html lang="pt-BR" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Esabel Santos Beleza — Agenda</title>
    <meta name="description" content="Agenda interna do salão Esabel Santos Beleza" />

    <!-- Theme color follows the active scheme (drives the mobile status bar). -->
    <meta name="theme-color" content="#b76e79" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14100f" media="(prefers-color-scheme: dark)" />

    <!--
      Warm up the Supabase connection (DNS + TLS) before the first query.
      Vite substitutes %VITE_*% placeholders in index.html at build time.
    -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ESB Agenda" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png?v=2" />
    <!--
      Tab icon is the lock mark, not the full wordmark: the script lettering is
      unreadable at these sizes. ?v=2 busts the browser's favicon cache, which
      is held separately from the normal HTTP cache and is very sticky.
    -->
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=2" />

    <script>
      // Apply the stored theme before paint to avoid a flash of the wrong scheme.
      (function () {
        try {
          var stored = localStorage.getItem("esb.theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("light", !dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
